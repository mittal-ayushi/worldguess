<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldGuess</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

</head>

<body>
<div id="navbar">
    <button id="next">Next Location</button>

    <img id="logo" src="logo.png" alt="WorldGuess">
</div>
<iframe
    id="streetview"
    width="800"
    height="500"
    style="border:0"
    allowfullscreen>
</iframe>

<div id="distance"></div>

<div id="map"></div>

<div id="mapContainer">
    <button id="toggle">Open Map</button>
    <button id="Confirm">Confirm Guess</button>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="script.js"></script>
<script src="map.js"></script>

</body>
</html>
